<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid and Flexbox Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @media (max-width: 768px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <link href="./src/output.css" rel="stylesheet" />
  </head>
  <body class="p-4">
    <header class="bg-blue-500 text-white p-4">
      <h1 class="text-3xl">Grid and Flexbox Layout</h1>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-3 gap-4 mt-4 min-h-screen">
      <section class="flex lg:col-span-2">
        <div class="bg-red-200 w-1/2 p-4">Flexbox Item 1</div>
        <div class="bg-red-400 w-1/2 p-4">Flexbox Item 2</div>
      </section>
      <aside class="bg-green-200 p-4">Sidebar</aside>
    </main>
    <section class="mt-6">
      <h2 class="text-2xl font-bold mb-6 justify-center items-center">
        Image Gallery
      </h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        <img
          class="w-full h-auto rounded"
          src="https://source.unsplash.com/featured/?coding,1"
          alt="Gallery image"
        />
        <img
          class="w-full h-auto rounded"
          src="https://source.unsplash.com/featured/?programming,2"
          alt="Gallery image"
        />
        <img
          class="w-full h-auto rounded"
          src="https://source.unsplash.com/featured/?developer,3"
          alt="Gallery image"
        />
        <img
          class="w-full h-auto rounded"
          src="https://source.unsplash.com/featured/?javascript,4"
          alt="Gallery image"
        />
        <img
          class="w-full h-auto rounded"
          src="https://source.unsplash.com/featured/?technology,5"
          alt="Gallery image"
        />
        <img
          class="w-full h-auto rounded"
          src="https://source.unsplash.com/featured/?computer,6"
          alt="Gallery image"
        />
      </div>
    </section>

    <footer class="bg-gray-800 text-white p-4 mt-4">
      <p>&copy; 2024 John Doe's Blog</p>
    </footer>
  </body>
</html>
